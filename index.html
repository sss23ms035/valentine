<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💝</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background: white;
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    position: relative;
  }

  img {
    width: 200px;
    max-width: 100%;
    margin-bottom: 15px;
  }

  h1 {
    font-size: 22px;
  }

  button {
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    margin: 10px;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background: #ff4d6d;
    color: white;
  }

  #noBtn {
    background: #eee;
    position: absolute;
  }

  .quote {
    font-style: italic;
    color: #ff4d6d;
    margin-top: 15px;
    display: none;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container" id="app">
  <!-- 🔁 REPLACE THIS GIF -->
  <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

  <h1>Can I borrow you for this Valentine? 💝</h1>

  <button id="yesBtn">Yes</button>
  <button id="noBtn">No</button>

  <div class="quote" id="quote">“I want to take a risk.”</div>

  <!-- 🔊 Sound -->
  <audio id="noSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
</div>

<script>
const noTexts = [
  "No",
  "Are you sure?",
  "Do you really want to do this?",
  "Last chance. You really don't want?",
  "My little heart is breaking. Still no?",
  "Asking again. Still no?",
  "I'll make a special maggie for you in this cold night. Still no?"
];

let step = 0;
let scale = 1;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const quote = document.getElementById("quote");
const app = document.getElementById("app");
const noSound = document.getElementById("noSound");

function moveNoButton() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = `${x}px`;
  noBtn.style.top = `${y}px`;
}

moveNoButton();

noBtn.addEventListener("click", () => {
  noSound.play();

  step++;
  scale += 0.25;
  yesBtn.style.transform = `scale(${scale})`;

  if (step < noTexts.length) {
    noBtn.textContent = noTexts[step];
    moveNoButton();
  }

  if (step === noTexts.length - 1) {
    noBtn.style.display = "none";
    quote.style.display = "block";
  }
});

yesBtn.addEventListener("click", () => {
  startConfetti();

  app.innerHTML = `
    <!-- 🔁 FINAL GIF -->
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
    <h1>Thank you ❤️</h1>
    <p>I'll be there for picking you up.</p>
  `;
});

/* 🎉 Confetti */
function startConfetti() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const confetti = Array.from({length: 150}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 2,
    d: Math.random() * 5 + 2
  }));

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${Math.random()*360},100%,50%)`;
      ctx.fill();
      c.y += c.d;
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>

</body>
</html>
