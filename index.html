<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💝</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background: white;
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  }

  img {
    width: 200px;
    margin-bottom: 15px;
  }

  h1 {
    font-size: 22px;
    margin-bottom: 15px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
  }

  button {
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background: #ff4d6d;
    color: white;
  }

  #noBtn {
    background: #eee;
  }

  .quote {
    margin-top: 25px;
    font-style: italic;
    color: #ff4d6d;
    font-size: 18px;
    display: none;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container" id="app">
  <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

  <h1>Sunita 💖, can I borrow you for this Valentine?</h1>

  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>

  <div class="quote" id="quote">
    “I’ll want to take a risk.”
  </div>

  <!-- Sounds -->
  <audio id="noSound" src="https://assets.mixkit.co/sfx/preview/mixkit-soft-click-tone-1112.mp3"></audio>
  <audio id="yesSound" src="https://assets.mixkit.co/sfx/preview/mixkit-magic-bling-902.mp3"></audio>
</div>

<script>
/* ALL NO TEXTS YOU GAVE */
const noTexts = [
  "No",
  "Are you sure?",
  "Do u really want to do this?",
  "Last chance. U really dont want?",
  "My little heart is quite breaking. Still ur answer is no?",
  "Asking again. Still no?",
  "I'll make a special maggie for u in this cold night. Still no?"
];

let step = 0;
let scale = 1;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const quote = document.getElementById("quote");
const app = document.getElementById("app");
const noSound = document.getElementById("noSound");
const yesSound = document.getElementById("yesSound");

noBtn.addEventListener("click", () => {
  noSound.play();

  step++;
  scale += 0.5;   // YES grows clearly
  yesBtn.style.transform = `scale(${scale})`;

  if (step < noTexts.length) {
    noBtn.textContent = noTexts[step];
  }

  // Final stage: NO disappears, quote shows
  if (step === noTexts.length - 1) {
    noBtn.style.display = "none";
    quote.style.display = "block";
  }
});

yesBtn.addEventListener("click", () => {
  yesSound.play();
  startConfetti();

  app.innerHTML = `
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
    <h1>Thank you, Sunita ❤️</h1>
    <p>I'll be there for picking you up.</p>
    <div class="quote" style="display:block; margin-top:25px;">
      “I’ll want to take a risk.”
    </div>
  `;
});

/* CONFETTI */
function startConfetti() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const confetti = Array.from({ length: 150 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 2,
    d: Math.random() * 5 + 2
  }));

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confetti.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${Math.random() * 360},100%,50%)`;
      ctx.fill();
      c.y += c.d;
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>

</body>
</html>
